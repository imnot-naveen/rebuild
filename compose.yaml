services:
  db:
    image: postgis/postgis:17-3.7
    environment:
      POSTGRES_DB: rebuild
      POSTGRES_USER: rebuild
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rebuild_dev}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U rebuild -d rebuild"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  postgres-data:
